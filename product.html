  <style>
    :root { --ink:#171918; --paper:#e9e8e2; --line:rgba(23,25,24,.22); --red:#b63c2d; --muted:#656b67; } * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:'DM Mono',monospace; } a { color:inherit; text-decoration:none; }
    header { padding:24px 5vw; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); } .logo { font:400 26px 'Libre Baskerville',serif; letter-spacing:-.06em; } .logo span { color:var(--red); } nav { display:flex; gap:25px; font-size:10px; letter-spacing:.1em; } nav a:hover { color:var(--red); }
    main { min-height:78vh; display:grid; grid-template-columns:1fr 1fr; } .visual { min-height:650px; background:linear-gradient(0deg,rgba(10,12,11,.3),transparent),var(--image) center/cover; } .copy { align-self:center; padding:8vw; } .eyebrow { color:var(--red); font-size:10px; letter-spacing:.16em; margin-bottom:20px; } h1 { font:400 clamp(40px,6vw,76px)/1 'Libre Baskerville',serif; letter-spacing:-.07em; margin:0 0 22px; } p { color:var(--muted); font-size:13px; line-height:1.9; max-width:440px; } .meta { border-top:1px solid var(--line); margin-top:35px; padding-top:18px; display:grid; grid-template-columns:1fr 1fr; gap:18px; } .meta strong { display:block; font:400 20px 'Libre Baskerville',serif; margin-bottom:6px; } .meta span { color:var(--muted); font-size:10px; } button { margin-top:28px; border:1px solid var(--ink); background:transparent; padding:15px 20px; font:10px 'DM Mono',monospace; letter-spacing:.1em; cursor:pointer; } button:hover { background:var(--ink); color:var(--paper); } .notice { color:var(--red); font-size:11px; margin-top:16px; } footer { padding:30px 5vw; border-top:1px solid var(--line); color:var(--muted); font-size:10px; display:flex; justify-content:space-between; } @media(max-width:720px) { nav { gap:12px; } main { display:block; } .visual { min-height:420px; } .copy { padding:65px 8vw; } footer { display:block; line-height:2; } }

  <main><div class="visual" id="visual"></div><section class="copy"><div class="eyebrow">HAND ASSEMBLED IN REYKJAVIK</div><h1 id="title">Timepiece</h1><p id="description"></p><div class="meta"><div><strong id="movement">Automatic</strong><span>MOVEMENT</span></div><div><strong id="origin">Iceland</strong><span>ASSEMBLED</span></div></div><button id="add" type="button">ADD TO BAG</button><div class="notice" id="notice" aria-live="polite"></div></section></main>

  <script>const products = { 101:{title:'Meridian 38',description:'A refined everyday watch with classical proportions, Roman and Arabic numerals and a quiet connection to Reykjavik.',movement:'Automatic',image:'https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=1200&q=85'}, frisland:{title:'Northlight Pilot',description:'A pilot watch inspired by the shifting light and open waters of the North Atlantic.',movement:'Automatic',image:'https://images.unsplash.com/photo-1533139502658-0198f920d8e8?auto=format&fit=crop&w=1200&q=85'}, sif:{title:'Coastguard Sentinel',description:'A strong, legible timepiece inspired by Icelandic waters and built for daily reliability.',movement:'Mechanical',image:'https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=1200&q=85'}, vinland:{title:'Tidebound Chronograph',description:'A chronograph where classic design meets modern engineering and North Atlantic character.',movement:'Chronograph',image:'https://images.unsplash.com/photo-1523170335258-f5ed11844a49?auto=format&fit=crop&w=1200&q=85'}, special:{title:'Eclipse Atelier Editions',description:'Small runs, rare materials and singular stories made for collectors.',movement:'Limited series',image:'https://images.unsplash.com/photo-1509048191080-d2984bad6ae5?auto=format&fit=crop&w=1200&q=85'}, islandus:{title:'Atlantic Forge',description:'A modern Icelandic sports watch with a confident silhouette and everyday versatility.',movement:'Automatic',image:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=1200&q=85'}, aurora:{title:'Aurora Rift 2026',description:'A new mechanical watch imagined around Icelandic night skies, with a luminous green dial and a red seconds hand.',movement:'Automatic',image:'assets/aurora-rift-2026.svg'} }; const key = new URLSearchParams(location.search).get('watch') || '101'; const product = products[key] || products[101]; document.title = `${product.title} | Major Watch'up Reykjavik`; document.querySelector('#title').textContent = product.title; document.querySelector('#description').textContent = product.description; document.querySelector('#movement').textContent = product.movement; document.querySelector('#visual').style.setProperty('--image', `url('${product.image}')`); document.querySelector('#add').addEventListener('click', () => { const bag = JSON.parse(localStorage.getItem('js-watch-bag') || '[]'); bag.push(product.title); localStorage.setItem('js-watch-bag', JSON.stringify(bag)); document.querySelector('#notice').textContent = 'ADDED TO BAG'; });</script>
<script>const productArt = { 'Meridian 38':'assets/meridian-38.svg', 'Northlight Pilot':'assets/northlight-pilot.svg', 'Coastguard Sentinel':'assets/coastguard-sentinel.svg', 'Tidebound Chronograph':'assets/tidebound-chronograph.svg', 'Eclipse Atelier Editions':'assets/eclipse-atelier.svg', 'Atlantic Forge':'assets/atlantic-forge.svg', 'Aurora Rift 2026':'assets/aurora-rift-2026.svg' }; const artName = document.querySelector('#title').textContent; if (productArt[artName]) document.querySelector('#visual').style.setProperty('--image', `url('${productArt[artName]}')`);</script>
<script>if (document.querySelector('#title').textContent.trim() === 'Meridian 38') document.querySelector('#visual').style.setProperty('--image', "url('assets/meridian-38-original.jpg')");</script>
<script>const textMap = { 'JS Watch':'Major Watch\'up', 'JS WATCH':'MAJOR WATCH\'UP' }; document.querySelectorAll('body *:not(script):not(style)').forEach((element) => element.childNodes.forEach((node) => { if (node.nodeType === Node.TEXT_NODE) Object.entries(textMap).forEach(([from, to]) => { node.textContent = node.textContent.replaceAll(from, to); }); }));</script>
<script>const productRenameMap = {'Meridian 38':'108','Northlight Pilot':'Kalltland','Coastguard Sentinel':'Gunna 1000','Tidebound Chronograph':'Grínland','Eclipse Atelier Editions':'Umbra','Atlantic Forge':'Vestmanneyjus','Gilbert':'Siggi Major','JS Watch':'Major Watch\'up','JS WATCH':'MAJOR WATCH\'UP'}; document.querySelectorAll('body *:not(script):not(style)').forEach((element) => element.childNodes.forEach((node) => { if (node.nodeType === Node.TEXT_NODE) Object.entries(productRenameMap).forEach(([from,to]) => { node.textContent = node.textContent.replaceAll(from,to); }); })); const queryKey = new URLSearchParams(location.search).get('watch') || '101'; const originalProductPhotos = {'101':'assets/meridian-108-original.jpg','108':'assets/meridian-108-original.jpg','frisland':'assets/kalltland-original.jpg','kalltland':'assets/kalltland-original.jpg','sif':'assets/gunna-1000-original.jpg','gunna':'assets/gunna-1000-original.jpg','vinland':'assets/grinland-original.jpg','grinland':'assets/grinland-original.jpg','special':'assets/umbra-original.png','umbra':'assets/umbra-original.png','islandus':'assets/vestmanneyjus-original.jpg','vestmanneyjus':'assets/vestmanneyjus-original.jpg','aurora':'assets/aurora-rift-2026.svg'}; if (originalProductPhotos[queryKey]) document.querySelector('#visual').style.setProperty('--image', `url('${originalProductPhotos[queryKey]}')`); document.title = `${document.querySelector('#title').textContent} | Major Watch'up Reykjavik`;</script>
<script>const canonicalTitles = { '108':'108', grinland:'Grínland', gunna:'Gunna 1000', umbra:'Umbra', vestmanneyjus:'Vestmanneyjus', kalltland:'Kalltland' }; const canonicalKey = new URLSearchParams(location.search).get('watch'); if (canonicalTitles[canonicalKey]) { document.querySelector('#title').textContent = canonicalTitles[canonicalKey]; document.title = `${canonicalTitles[canonicalKey]} | Major Watch'up Reykjavik`; }</script>
