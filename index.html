<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jepps</title>
  <style>
    .tetris-link { position: fixed; top: 20px; right: 20px; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: #172033; color: #fff; text-decoration: none; font-size: 15px; font-weight: 600; box-shadow: 0 4px 16px #0002; }
    .tetris-link:hover { background: #293955; }
    .tetris-link:focus-visible { outline: 3px solid #8056dc; outline-offset: 4px; }
    .tetris-icon { display: grid; grid-template-columns: repeat(3, 7px); grid-template-rows: repeat(2, 7px); gap: 2px; }
    .tetris-icon i { background: #b583f5; border-radius: 1px; }
    .tetris-icon i:first-child { grid-column: 2; }
    .tetris-icon i:nth-child(2) { grid-column: 1; }
    @media (max-width: 480px) { .tetris-link { top: 12px; right: 12px; } }
    body {
      background-color: #f4f4f4;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <a class="tetris-link" href="tetris/" aria-label="Spila Tetris"><span class="tetris-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Spila Tetris</a>
  Jepps, I'm here !
</body>
</html>
